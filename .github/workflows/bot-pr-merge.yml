# B3：经验库更新走 PR；本工作流在该 PR 的 Touchstone 评审完成且 gate 绿、且改动仅限
# data/experience_store.json / data/ground_truth.json 时，自动合入。人审不强制（B3 约定）。
# 内容闸是安全边界：只能合"仅改两个数据文件"的 PR，含任何其它路径一律拒——
# 自主边界 = 验证边界（哪怕 bot 分支被污染塞了代码，本回路也不会合入）。
name: Auto-merge bot experience PR

on:
  workflow_run:
    workflows: ["Touchstone"]
    types: [completed]

concurrency:
  group: bot-pr-merge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    # workflow_run.conclusion == 'success' ⟺ Touchstone 各 job（关键是 gate）全过
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          NUM=$(gh pr list --head bot/experience-update --base main --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -z "${NUM:-}" ]; then echo "no open bot/experience-update PR, skip"; exit 0; fi
          # 内容闸：只允许改动这两个数据文件；出现任何其它路径 → 拒绝合入
          FILES=$(gh pr diff "$NUM" --name-only)
          BAD=$(echo "$FILES" | grep -vE '^data/(experience_store|ground_truth)\.json$' || true)
          if [ -n "$BAD" ]; then
            echo "PR #$NUM 含非数据文件改动，拒绝自动合入："; echo "$BAD"; exit 1
          fi
          echo "PR #$NUM 仅含数据文件，Touchstone gate 绿，合入"
          gh pr merge "$NUM" --squash --delete-branch
