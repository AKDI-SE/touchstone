# .touchstone/seeds.yaml —— 团队手写规范种子（评审时直接注入 PR-Agent 提示词，advisory-only）。
#
# 依据（数据，非拍脑袋）：data/ground_truth.json 98 条校准真值的人审裁决统计
# （2026-08-17 快照，learn.yml 每周重建）：
#   PRA-REVIEW   20 raised / 12 adopted /  8 ignored —— 采纳率 0.60，全类型最高 → emphasize
#   PRA-GENERAL  20 raised /  6 adopted / 14 ignored —— 采纳率 0.30，全类型最低 → suppress
# 口径：adopted = 人 resolve 了该类型发现（calibrate.thread_findings）；raised = touchstone
# 实际挑过该类型的 PR 数。样本 20/20，方向可信；数值会随后续裁决漂移，本文件由人按
# 最新 calibration.json 定期复核（建议随 release 节奏看一眼）。
#
# 注：PRA-REVIEW 是无 label 的 review 工具发现的兜底类型（review_provider.normalize
# 的 label-or-kind 规则）；PRA-GENERAL 是显式标 general 的发现——两者语义不同，别合并对待。

- finding_type: PRA-REVIEW
  kind: emphasize
  text: Prioritize concrete, code-level review findings (logic errors, robustness gaps, API misuse) anchored to file and line; these get acted on in this repo.

- finding_type: PRA-GENERAL
  kind: suppress
  text: Avoid generic or vague commentary (style preferences, restating the diff, non-actionable suggestions); humans dismiss these as noise in this repo.
